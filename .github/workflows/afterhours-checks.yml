name: After Hours access and private media checks
on:
  pull_request:
    paths:
      - 'api/afterhours/**'
      - 'lib/afterhours-*.js'
      - 'src/afterhours/**'
      - 'test/afterhours-*.test.js'
      - 'afterhours-bridge.html'
      - 'public/afterhours-bridge.js'
      - '.github/workflows/afterhours-checks.yml'
  push:
    branches: [main]
    paths:
      - 'api/afterhours/**'
      - 'lib/afterhours-*.js'
      - 'src/afterhours/**'
      - 'test/afterhours-*.test.js'
permissions:
  contents: read
jobs:
  afterhours-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Party currently has no lockfile; do not enable npm caching or npm ci yet.
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: node --test test/afterhours-*.test.js
      - run: npm run build
